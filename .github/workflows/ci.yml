# Every push and pull request: `make test` against zcag/pal at main, checked
# out into .pal/ (the SDK, the host and its test harness, the gallery). This
# is all it does and it holds no secret: pal's registry (its
# extensions.yml) polls this repo's main, and takes a commit whose run here
# is green, within about 15 minutes.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # pal's main, once: both platforms test against the same commit.
  pal:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.pal.outputs.sha }}
    steps:
      - id: pal
        run: echo "sha=$(git ls-remote https://github.com/zcag/pal refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

  # The two platforms pal ships for: some extensions are one platform's, and their tests say so.
  test:
    needs: pal
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zcag/pal
          ref: ${{ needs.pal.outputs.sha }}
          path: .pal
          persist-credentials: false

      # The Bun pal ships as its sidecar (.pal/app/scripts/fetch-bun.sh pins it).
      - name: Bun version
        id: bun
        run: echo "version=$(sed -n 's/^BUN_VERSION=//p' .pal/app/scripts/fetch-bun.sh)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # A pal.json that changed is read by pal's gallery: its app tests run too (APP=1).
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && ! [[ $BASE =~ ^0+$ ]] && git fetch -q --depth=1 origin "$BASE" 2>/dev/null; then
            if git diff --name-only "$BASE" HEAD | grep -q '/pal.json$'; then echo "app=1" >> "$GITHUB_OUTPUT"; fi
          else
            echo "app=1" >> "$GITHUB_OUTPUT"
          fi
      # The app's tests read every extension pal has: the other repo too.
      - uses: actions/checkout@v4
        if: steps.scope.outputs.app == '1'
        with:
          repository: zcag/pal-games
          ref: main
          path: .ext/pal-games
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.app == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .pal/app/package-lock.json

      - name: Install
        run: |
          (cd .pal && bun install --frozen-lockfile)
          if [ "${{ steps.scope.outputs.app }}" = 1 ]; then (cd .pal/app && npm ci); fi
          for d in */; do
            if [ -f "$d/package.json" ]; then (cd "$d" && bun install --frozen-lockfile); fi
          done
      - run: make test APP=${{ steps.scope.outputs.app }}
