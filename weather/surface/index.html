<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <script src="/__pal/surface.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <canvas id="sky"></canvas>
  <canvas id="fx"></canvas>
  <main id="app">
    <section id="hero">
      <div id="art"></div>
      <button id="place" type="button" tabindex="-1" title="Change the place (L)"><span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 3.5 3 11.2l7.4 2.4 2.4 7.4z"/></svg></button>
      <div id="when"></div>
      <div id="temp"></div>
      <div id="cond"></div>
      <div id="range"></div>
    </section>
    <section id="cards">
      <div class="card" id="hours">
        <p id="summary"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span></span></p>
        <div id="strip"><div id="track"></div></div>
      </div>
      <div class="card" id="days">
        <h3><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Next days</h3>
        <ol id="week"></ol>
      </div>
    </section>
  </main>
  <div id="search" hidden>
    <div class="sheet">
      <label><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM15.4 15.4 20 20"/></svg><input id="q" type="text" placeholder="Search for a city" autocomplete="off" spellcheck="false"></label>
      <ol id="found"></ol>
      <footer><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> choose <kbd>tab</kbd> close</footer>
    </div>
  </div>
  <div id="note" hidden></div>
</body>
</html>
